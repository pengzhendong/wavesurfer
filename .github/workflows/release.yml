name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Build version (e.g. 0.0.1)"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: printf '%s\n' "${RELEASE_VERSION}" > VERSION
      - name: Refresh pinned browser assets
        run: bash scripts/update_vendor_assets.sh
      - name: Install build and test dependencies
        run: python -m pip install -e ".[test]" build twine
      - name: Test
        run: |
          python -m pytest
          node --test tests/js/*.test.js
      - name: Build
        run: python -m build
      - name: Publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload dist/*
