[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wavesurfer"
authors = [{ name = "Zhendong Peng", email = "pzd17@tsinghua.org.cn" }]
description = "Audio visualization and streaming playback for Jupyter notebooks"
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
dynamic = ["version"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "audiolab>=0.5.2",
    "ipython",
    "jinja2",
    "matplotlib",
    "numpy",
    "tgt",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=5",
]

[project.urls]
Homepage = "https://github.com/pengzhendong/wavesurfer"
Documentation = "https://github.com/pengzhendong/wavesurfer#readme"
BugTracker = "https://github.com/pengzhendong/wavesurfer/issues"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
include = ["wavesurfer", "wavesurfer.*"]

[tool.setuptools.package-data]
wavesurfer = [
    "configs/*.json",
    "js/**/*.js",
    "js/vendor-licenses/*",
    "templates/*.txt",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
